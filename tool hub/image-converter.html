<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convert Image Online - JPG to PNG, PNG to JPG, WebP | ToolHub</title>
  <meta name="description" content="Convert images between JPG, PNG and WebP online for free. Fast and 100% private.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">Tool<span>Hub</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="image-compressor.html">Compressor</a>
        <a href="image-resizer.html">Resizer</a>
        <a href="image-converter.html">Converter</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Convert Image Online</h1>
      <p>Change JPG, PNG and WebP images to any format. Free and 100% private.</p>
    </section>
    <section class="tool">
      <div class="dropzone" id="dropzone">
        <p class="drop-title">Drag and drop your image here</p>
        <p class="drop-or">or</p>
        <button class="btn" id="selectBtn">Select Image</button>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
        <p class="drop-note">Supports JPG, PNG, WebP</p>
      </div>
      <div class="result" id="result" hidden>
        <div class="quality-box">
          <label for="formatSelect">Convert to:</label>
          <select id="formatSelect" class="select">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div class="preview-grid">
          <div class="preview-card">
            <h3>Original</h3>
            <img id="originalImg" alt="Original image">
            <p id="originalInfo"></p>
          </div>
          <div class="preview-card">
            <h3>Converted</h3>
            <img id="convertedImg" alt="Converted image">
            <p id="convertedInfo"></p>
          </div>
        </div>
        <div class="actions">
          <a class="btn" id="downloadBtn" download="converted-image.jpg">Download Converted Image</a>
          <button class="btn btn-light" id="resetBtn">Convert Another</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ToolHub. All processing happens in your browser.</p>
    </div>
  </footer>

  <script src="converter.js"></script>
</body>
</html>
